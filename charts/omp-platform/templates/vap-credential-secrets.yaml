# subtrees ownership: a Session CR may only reference users/<name>/... subtrees under
# the requester's own name prefix. Admins and the operator are exempt.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: omp-credential-secrets-ownership
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["omp.mirantis.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sessions"]
  matchConditions:
    - name: exclude-operator
      expression: "request.userInfo.username != 'system:serviceaccount:omp-system:omp-operator'"
    - name: exclude-break-glass-admin
      expression: "request.userInfo.username != '{{ .Values.adminAccount }}'"
    - name: exclude-admin-group
      expression: "!('omp-admins@{{ .Values.groupDomain }}' in request.userInfo.groups)"
  validations:
    - expression: >-
        !has(object.spec.subtrees) ||
        object.spec.subtrees.filter(e, e.startsWith('users/')).all(e,
          e.split('/')[1] == request.userInfo.username.split('@')[0])
      message: >-
        spec.subtrees entries under users/ must use your own username prefix
        (users/<your-user>/...); referencing another user's subtrees is
        not permitted.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: omp-credential-secrets-ownership
spec:
  policyName: omp-credential-secrets-ownership
  validationActions: [Deny]
