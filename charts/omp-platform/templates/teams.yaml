{{- range .Values.teams }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: omp-team-{{ . }}
  labels:
    omp.mirantis.io/team: {{ . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omp-session-user
  namespace: omp-team-{{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omp-team-member
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: omp-team-{{ . }}@{{ $.Values.groupDomain }}
{{- end }}
