name: Build images

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'operator/**'
      - 'platform/**'
      - 'session-template/**'
  schedule:
    # Daily rebuild of the session image to track new omp releases.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-session:
    name: Build omp-session image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest omp version
        id: omp
        run: echo "version=$(npm view @oh-my-pi/pi-coding-agent version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/omp-session
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=omp-${{ steps.omp.outputs.version }},enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            OMP_VERSION=${{ steps.omp.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-operator:
    name: Build omp-operator image
    runs-on: ubuntu-latest
    # Operator does not track the omp version — skip it on the daily schedule.
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/omp-operator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: operator
          file: operator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
