name: Build images

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'operator/**'
      - 'platform/**'
      - 'session-template/**'
      - 'relay/**'
  schedule:
    # Daily rebuild of the session image to track new omp releases.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed image paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only push events have a meaningful before/after diff; schedule and
    # workflow_dispatch always build everything the downstream jobs allow
    # (each job's `if` treats a non-'push' event as "build regardless").
    if: github.event_name == 'push'
    outputs:
      session: ${{ steps.filter.outputs.session }}
      operator: ${{ steps.filter.outputs.operator }}
      relay: ${{ steps.filter.outputs.relay }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            session:
              - 'Dockerfile'
              - 'docker/**'
              - 'platform/**'
              - 'session-template/**'
            operator:
              - 'operator/**'
            relay:
              - 'relay/**'

  build-session:
    name: Build omp-session image
    needs: changes
    # `always()` so this still runs on schedule/workflow_dispatch, where the
    # `changes` job is skipped (its outputs are then empty, not 'true' — the
    # `github.event_name != 'push'` half of the condition covers those events).
    if: |
      always() &&
      (github.event_name != 'push' || needs.changes.outputs.session == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest omp version
        id: omp
        run: echo "version=$(npm view @oh-my-pi/pi-coding-agent version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/omp-session
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=omp-${{ steps.omp.outputs.version }},enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            OMP_VERSION=${{ steps.omp.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-operator:
    name: Build omp-operator image
    needs: changes
    # Operator does not track the omp version — skip it on the daily schedule.
    # Otherwise build unless this is a push that didn't touch operator/**.
    if: |
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'push' || needs.changes.outputs.operator == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/omp-operator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: operator
          file: operator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-relay:
    name: Build omp-relay image
    needs: changes
    # Relay doesn't track omp releases — skip it on the daily schedule.
    # Otherwise build unless this is a push that didn't touch relay/**.
    if: |
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'push' || needs.changes.outputs.relay == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/omp-relay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: relay
          file: relay/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
