apiVersion: v1
kind: Namespace
metadata:
  name: omp-system
  labels:
    app.kubernetes.io/managed-by: administrator.sh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omp-operator
  namespace: omp-system
  annotations:
    iam.gke.io/gcp-service-account: "omp-operator@${GCP_PROJECT}.iam.gserviceaccount.com"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omp-operator
rules:
  # Session CRD
  - apiGroups: ["omp.mirantis.io"]
    resources: ["sessions", "sessions/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Namespace management
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "persistentvolumeclaims", "configmaps", "serviceaccounts", "services"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
  # StatefulSets: operator manages session pods via a StatefulSet (Option C)
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
  # Secrets: cluster-wide (creates auth-broker-token in session namespaces).
  # list/watch deliberately omitted; no reads of omp-system or omp-user-* namespaces.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # NetworkPolicy
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # ExternalSecret
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # kopf: post events and leader-election leases
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # kopf: watch CRD changes to detect resource additions/removals at runtime
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Team pod access: operator creates Role+RoleBinding granting teams exec/log in session namespaces.
  # Privilege-escalation admission requires the operator to hold every permission it grants.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # pods/log included so the operator can put it in the team Role without escalation rejection
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omp-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omp-operator
subjects:
  - kind: ServiceAccount
    name: omp-operator
    namespace: omp-system
