apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sessions.omp.mirantis.io
spec:
  group: omp.mirantis.io
  scope: Namespaced
  names:
    kind: Session
    plural: sessions
    singular: session
    shortNames:
      - sess
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: PHASE
          jsonPath: .status.phase
          type: string
        - name: STATE
          jsonPath: .spec.state
          type: string
        - name: NAMESPACE
          jsonPath: .status.namespace
          type: string
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                subtrees:
                  type: array
                  items:
                    type: string
                  description: >-
                    Deprecated — use credentialSecrets instead. Retained for
                    backward compatibility with existing sessions only.
                view:
                  type: boolean
                  default: false
                image:
                  type: string
                  description: >-
                    Override session image; defaults to operator env
                    OMP_SESSION_IMAGE
                env:
                  type: object
                  description: >-
                    Extra environment variables injected into the session pod
                    (e.g. GEMINI_API_KEY for bootstrap auth before Anthropic OAuth).
                  additionalProperties:
                    type: string
                configRef:
                  type: string
                  description: >-
                    Name of a ConfigMap in omp-system to copy as omp-config
                    into the session namespace. Defaults to "omp-config".
                    Use named profiles (e.g. omp-config-gemini,
                    omp-config-anthropic) to give sessions different model roles.
                state:
                  type: string
                  enum: [running, stopped]
                  default: running
                  description: >-
                    Desired pod state. running = pod present; stopped = pod
                    removed, namespace + PVC + secrets retained.
                authBroker:
                  type: boolean
                  default: false
                  description: >-
                    When true, the operator adds an omp auth-broker sidecar
                    container to the session pod. The sidecar serves credentials
                    on localhost; omp uses it via OMP_AUTH_BROKER_URL.
                    Initial auth still requires one exec per provider; the broker
                    then handles automatic token refresh.
                team:
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                  description: >-
                    Owning team slug. When set, the session namespace is
                    omp-session-<team>-<name> and the operator grants group
                    omp-team-<team>@<domain> exec/attach/log on the pod. The
                    Session CR MUST be created in namespace omp-team-<team>. When
                    unset (admin/shared sessions), namespace is omp-session-<name>
                    with no team binding.
                credentialSecrets:
                  type: array
                  items:
                    type: string
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                  description: >-
                    Personal credentials to inject into the session pod.
                    Format: "<user>/<secret-name>" — the operator reads secret
                    <secret-name> from namespace omp-user-<user>. Only secrets
                    in that user's own namespace are accessible; users cannot
                    reference another user's credentials. Later entries win on
                    env var conflict. Example: ["jnesbitt/atlassian-token",
                    "jnesbitt/ollama-key"]
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Running
                    - Hosting
                    - Failed
                    - Terminating
                    - Stopped
                namespace:
                  type: string
                podName:
                  type: string
                joinLink:
                  type: string
                viewLink:
                  type: string
                message:
                  type: string
                restartedAt:
                  type: string
                  description: >-
                    Value of the omp.mirantis.io/restartedAt annotation last
                    applied by the operator.
                authBrokerUrl:
                  type: string
                  description: >-
                    localhost URL of the auth-broker sidecar (set when authBroker=true).
