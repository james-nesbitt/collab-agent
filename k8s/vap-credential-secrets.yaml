# credentialSecrets ownership: a Session CR may only reference secrets under
# the requester's own <user>/ prefix. Admins and the operator are exempt.
# Applied by: ./administrator.sh bootstrap
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: omp-credential-secrets-ownership
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["omp.mirantis.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sessions"]
  matchConditions:
    - name: exclude-operator
      expression: "request.userInfo.username != 'system:serviceaccount:omp-system:omp-operator'"
    - name: exclude-break-glass-admin
      expression: "request.userInfo.username != '${ADMIN_GCP_ACCOUNT}'"
    - name: exclude-admin-group
      expression: "!('omp-admins@${OMP_GROUP_DOMAIN}' in request.userInfo.groups)"
  validations:
    - expression: >-
        !has(object.spec.credentialSecrets) ||
        object.spec.credentialSecrets.all(e,
          e.split('/')[0] == request.userInfo.username.split('@')[0])
      message: >-
        spec.credentialSecrets entries must use your own username prefix
        (<your-user>/<secret>); referencing another user's credentials is
        not permitted.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: omp-credential-secrets-ownership
spec:
  policyName: omp-credential-secrets-ownership
  validationActions: [Deny]
